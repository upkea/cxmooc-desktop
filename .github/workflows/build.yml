name: build-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成注入 bundle
        run: node make-bundle.js

      - name: 安装依赖
        run: npm install

      - name: 打包（win-unpacked + NSIS 安装包）
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap

      - name: 生成最新版信息（自动更新用 latest.yml）
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),crypto=require('crypto');const fsx=require('fs').readdirSync('release').filter(f=>f.endsWith('.exe')&&!f.endsWith('.blockmap'));if(fsx.length){const name=fsx[0];const buf=fs.readFileSync('release/'+name);const sha=crypto.createHash('sha512').update(buf).digest('base64');const yml=['version: '+require('./package.json').version,'files:','  - url: '+name,'    sha512: '+sha,'    size: '+buf.length,'path: '+name,'sha512: '+sha,\"releaseDate: '\"+new Date().toISOString()+\"'\",''].join('\n');fs.writeFileSync('release/latest.yml',yml);}"

      - name: 发布 GitHub Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml